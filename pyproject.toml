# ----------------------------------------------------
# [build-system] must be present in pyproject.toml
# ----------------------------------------------------

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
# ----------------------------------------------------
# [project] is the new standard for metadata
# ----------------------------------------------------
[project]
name = "zchtest"
version = "0.1.0"
description = "A simple ZCH test package"
readme = "README.md"
authors = [
    { name = "ZCH", email = "zchao@icrr.u-tokyo.ac.jp" },
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
]

# -------------------------------------------------
# Console script entry points
# -------------------------------------------------
[project.scripts]
zch-hello = "zchtest.cli:hello"

